name: Build and Blue-Green Deploy to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_USER: sarithrgu
  AWS_REGION: ap-southeast-2
  CLUSTER: newevent-cluster
  NAMESPACE: newevent

jobs:
  # ---------- JOB 1: Build and push the frontend image ----------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the new frontend image
        run: |
          docker build -t $DOCKER_USER/newevent-frontend:${{ github.sha }} -f Dockerfile .
          docker push $DOCKER_USER/newevent-frontend:${{ github.sha }}

  # ---------- JOB 2: Blue-Green deploy to EKS ----------
  blue-green-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect kubectl to EKS
        run: aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION

      - name: Determine the idle colour
        run: |
          LIVE=$(kubectl get service frontend-bg -n $NAMESPACE -o jsonpath='{.spec.selector.version}')
          echo "Currently live: $LIVE"
          if [ "$LIVE" = "blue" ]; then
            echo "IDLE=green" >> $GITHUB_ENV
          else
            echo "IDLE=blue" >> $GITHUB_ENV
          fi

      - name: Deploy the new image to the idle colour
        run: |
          kubectl set image deployment/frontend-$IDLE \
            frontend=$DOCKER_USER/newevent-frontend:${{ github.sha }} -n $NAMESPACE
          kubectl rollout status deployment/frontend-$IDLE -n $NAMESPACE --timeout=120s

      - name: Switch traffic to the newly deployed colour
        run: |
          kubectl patch service frontend-bg -n $NAMESPACE \
            -p "{\"spec\":{\"selector\":{\"app\":\"frontend-bg\",\"version\":\"$IDLE\"}}}"
          echo "Traffic switched to $IDLE"