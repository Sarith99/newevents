            limits: { cpu: "150m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: newevent
spec:
  type: ClusterIP
  selector: { app: analytics-service }
  ports: [{ port: 80, targetPort: 8080 }]