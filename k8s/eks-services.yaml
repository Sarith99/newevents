apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: newevent
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: sarithrgu/newevent-frontend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: newevent
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: newevent
spec:
  replicas: 1
  selector:
    matchLabels: { app: event-service }
  template:
    metadata:
      labels: { app: event-service }
    spec:
      containers:
        - name: event-service
          image: sarithrgu/event-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__EventDb
              valueFrom: { secretKeyRef: { name: event-db-secret, key: ConnectionStrings__EventDb } }
          resources:
            requests: { cpu: "25m", memory: "96Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: newevent
spec:
  type: ClusterIP
  selector: { app: event-service }
  ports: [{ port: 80, targetPort: 8080 }]
---
