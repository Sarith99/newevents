    matchLabels: { app: analytics-service }
  template:
    metadata:
      labels: { app: analytics-service }
    spec:
      containers:
        - name: analytics-service
          image: sarithrgu/analytics-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
