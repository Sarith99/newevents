apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: newevent
spec:
  replicas: 1
  selector:
    matchLabels: { app: registration-service }
  template:
    metadata:
      labels: { app: registration-service }
    spec:
      containers:
        - name: registration-service
          image: sarithrgu/registration-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__RegistrationDb
              valueFrom: { secretKeyRef: { name: registration-db-secret, key: ConnectionStrings__RegistrationDb } }
            - name: EventServiceUrl
              value: "http://event-service"
          resources:
            requests: { cpu: "25m", memory: "96Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: newevent
