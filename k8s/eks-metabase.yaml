apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: newevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      initContainers:
        - name: fetch-clickhouse-driver
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - "curl -L -o /plugins/clickhouse.metabase-driver.jar https://github.com/ClickHouse/metabase-clickhouse-driver/releases/download/1.50.4/clickhouse.metabase-driver.jar"
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      containers:
        - name: metabase
          image: metabase/metabase:v0.50.21
          ports:
            - containerPort: 3000
          env:
            - name: MB_PLUGINS_DIR
              value: /plugins
          volumeMounts:
            - name: plugins
              mountPath: /plugins
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
      volumes:
        - name: plugins
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: newevent
spec:
  type: ClusterIP
  selector:
    app: metabase
  ports:
    - port: 3000
      targetPort: 3000